<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technox | Mi carrito</title>

    <link rel="shortcut icon" href="img/cropped_circle_image.png" type="image/x-icon">
    <link rel="stylesheet" href="css/styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <nav class="barraNavProductos">
        <img src="img/Gemini_Generated_Image_wu7h99wu7h99wu7h_nobg.png" alt="Logo Technox">

        <div class="menu">
            <ul class="listaProductos">
                <li>
                    <a href="productos.html">Volver a productos</a>
                </li>
            </ul>
        </div>
    </nav>

    <main>
        <h1>Mi carrito</h1>

        <div id="contenedorCarrito"></div>

        <h2 id="totalCarrito"></h2>
    </main>

    <script>
        const contenedorCarrito = document.getElementById("contenedorCarrito");
        const totalCarrito = document.getElementById("totalCarrito");

        function mostrarCarrito() {
            let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

            if (carrito.length === 0) {
                contenedorCarrito.innerHTML = "<p>Tu carrito está vacío.</p>";
                totalCarrito.innerHTML = "";
                return;
            }

            let html = "";
            let total = 0;

            carrito.forEach(producto => {
                let subtotal = producto.precio * producto.cantidad;
                total += subtotal;

                html += `
                    <div class="card-producto">
                        <img class="card-img" src="${producto.imagen}" alt="${producto.nombre}">
                        <h3>${producto.nombre}</h3>
                        <p>Precio: $${producto.precio}</p>
                        <p>Cantidad: ${producto.cantidad}</p>
                        <p>Subtotal: $${subtotal}</p>

                        <button onclick="cambiarCantidad(${producto.id}, -1)">-</button>
                        <button onclick="cambiarCantidad(${producto.id}, 1)">+</button>
                        <button onclick="eliminarProducto(${producto.id})">Eliminar</button>
                    </div>
                `;
            });

            contenedorCarrito.innerHTML = html;
            totalCarrito.innerHTML = "Total: $" + total;
        }

        function cambiarCantidad(id, cambio) {
            let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

            let producto = carrito.find(p => p.id == id);

            if (producto) {
                producto.cantidad += cambio;

                if (producto.cantidad <= 0) {
                    carrito = carrito.filter(p => p.id != id);
                }
            }

            localStorage.setItem("carrito", JSON.stringify(carrito));
            mostrarCarrito();
        }

        function eliminarProducto(id) {
            let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

            carrito = carrito.filter(p => p.id != id);

            localStorage.setItem("carrito", JSON.stringify(carrito));
            mostrarCarrito();
        }

        mostrarCarrito();
    </script>

</body>
</html>
